<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="460" fill="#0d1117"/>
  <text x="450" y="34" fill="#f0f6fc" font-size="20" font-weight="bold" text-anchor="middle">Arquitetura Macro - PM_API (Global Solution 2026/1)</text>
  <text x="450" y="56" fill="#8b949e" font-size="13" text-anchor="middle">Fluxo: Usuario - Azure VM (Docker) - App .NET - PostgreSQL</text>

  <!-- Usuario -->
  <rect x="40" y="170" width="130" height="80" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="105" y="205" fill="#f0f6fc" font-size="14" font-weight="bold" text-anchor="middle">Usuario</text>
  <text x="105" y="226" fill="#8b949e" font-size="11" text-anchor="middle">Navegador /</text>
  <text x="105" y="240" fill="#8b949e" font-size="11" text-anchor="middle">Swagger / App Mobile</text>

  <!-- Seta usuario -> VM -->
  <line x1="170" y1="210" x2="245" y2="210" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="207" y="200" fill="#58a6ff" font-size="10" text-anchor="middle">HTTP :8080</text>

  <!-- Azure VM (caixa grande) -->
  <rect x="245" y="90" width="610" height="290" rx="14" fill="#10161d" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="270" y="116" fill="#3fb950" font-size="14" font-weight="bold">Azure VM (Linux) - Docker Engine</text>

  <!-- Rede docker -->
  <rect x="270" y="135" width="560" height="225" rx="10" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="285" y="154" fill="#d29922" font-size="12" font-weight="bold">rede: pmnet (bridge)</text>

  <!-- Container App -->
  <rect x="300" y="175" width="220" height="150" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="410" y="202" fill="#f0f6fc" font-size="14" font-weight="bold" text-anchor="middle">Container: app-RMxxxx</text>
  <text x="410" y="224" fill="#8b949e" font-size="11" text-anchor="middle">.NET 10 / ASP.NET Core</text>
  <text x="410" y="242" fill="#8b949e" font-size="11" text-anchor="middle">PM_API (CRUD REST)</text>
  <text x="410" y="260" fill="#8b949e" font-size="11" text-anchor="middle">usuario nao-root</text>
  <text x="410" y="278" fill="#8b949e" font-size="11" text-anchor="middle">porta interna 8080</text>
  <text x="410" y="300" fill="#3fb950" font-size="11" text-anchor="middle">imagem personalizada</text>

  <!-- Container DB -->
  <rect x="600" y="175" width="200" height="150" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
  <text x="700" y="202" fill="#f0f6fc" font-size="14" font-weight="bold" text-anchor="middle">Container: db-RMxxxx</text>
  <text x="700" y="224" fill="#8b949e" font-size="11" text-anchor="middle">PostgreSQL 16</text>
  <text x="700" y="242" fill="#8b949e" font-size="11" text-anchor="middle">6 tabelas relacionadas</text>
  <text x="700" y="260" fill="#8b949e" font-size="11" text-anchor="middle">porta interna 5432</text>

  <!-- Volume -->
  <rect x="620" y="278" width="160" height="34" rx="6" fill="#21262d" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="700" y="300" fill="#bc8cff" font-size="11" text-anchor="middle">volume: pmdata</text>

  <!-- Seta App -> DB -->
  <line x1="520" y1="250" x2="598" y2="250" stroke="#d29922" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="559" y="240" fill="#d29922" font-size="10" text-anchor="middle">EF Core</text>
  <text x="559" y="266" fill="#d29922" font-size="10" text-anchor="middle">Npgsql :5432</text>

  <!-- Portas publicadas -->
  <text x="410" y="350" fill="#58a6ff" font-size="11" text-anchor="middle">publica 8080:8080</text>
  <text x="700" y="350" fill="#bc8cff" font-size="11" text-anchor="middle">publica 5432:5432</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
